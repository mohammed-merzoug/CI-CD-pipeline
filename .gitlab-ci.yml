# GitLab CI/CD Pipeline - Django E-commerce Application
# Runner: Windows Shell Executor (PowerShell)

stages:
  - dependencies
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  DOCKER_DRIVER: overlay2
  PIP_NO_PROGRESS_BAR: "1"

# STAGE 1 - Install Dependencies
install_dependencies:
  stage: dependencies
  script:
    - echo "Creating virtual environment"
    - python -m venv .venv
    - echo "Upgrading pip"
    - .\.venv\Scripts\python.exe -m pip install --upgrade pip --quiet
    - echo "Installing dependencies"
    - .\.venv\Scripts\python.exe -m pip install -r requirements.txt --quiet
    - echo "Dependencies installed successfully"
  artifacts:
    paths:
      - .venv/
    expire_in: 2 hours
  cache:
    key: "$CI_COMMIT_REF_SLUG-pip"
    paths:
      - .venv/
  tags:
    - windows

# STAGE 2 - Run Tests
run_tests:
  stage: test
  dependencies:
    - install_dependencies
  script:
    - echo "Running Django system checks"
    - .\.venv\Scripts\python.exe manage.py check
    - echo "Checking migrations"
    - .\.venv\Scripts\python.exe manage.py makemigrations --dry-run --check
    - echo "Running unit tests"
    - .\.venv\Scripts\python.exe manage.py test --verbosity=2
    - echo "All tests passed"
  artifacts:
    when: always
    paths:
      - test-results/
    expire_in: 1 week
  tags:
    - windows

# STAGE 2 - Code Quality Check (Bonus)
code_quality:
  stage: test
  dependencies:
    - install_dependencies
  script:
    - echo "Installing linting tools"
    - .\.venv\Scripts\python.exe -m pip install flake8 --quiet
    - echo "Running flake8 code quality check"
    - .\.venv\Scripts\python.exe -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=migrations,__pycache__,.venv
    - echo "Code quality check complete"
  allow_failure: true
  tags:
    - windows

# STAGE 3 - Build Docker Image (Bonus)
build_docker_image:
  stage: build
  script:
    - echo "Logging in to GitLab Container Registry"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Building Docker image"
    - docker build -t $DOCKER_IMAGE .
    - docker tag $DOCKER_IMAGE "${CI_REGISTRY_IMAGE}:latest"
    - echo "Pushing image to GitLab Container Registry"
    - docker push $DOCKER_IMAGE
    - docker push "${CI_REGISTRY_IMAGE}:latest"
    - echo "Docker image built and pushed successfully"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "GitLab-CI-CD-pipeline"'
  tags:
    - windows

# STAGE 4 - Deploy to Production (Auto-deploy on main)
production_deploy:
  stage: deploy
  script:
    - echo "Starting deployment"
    - echo "Branch $CI_COMMIT_BRANCH"
    - echo "Commit $CI_COMMIT_SHA"
    - echo "Logging in to GitLab Container Registry"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Pulling latest Docker image"
    - docker pull "${CI_REGISTRY_IMAGE}:latest"
    - echo "Stopping existing container"
    - docker stop ecommerce-app 2>$null; echo "stopped"
    - docker rm ecommerce-app 2>$null; echo "removed"
    - echo "Starting new container"
    - docker run -d --name ecommerce-app -p 8000:8000 "${CI_REGISTRY_IMAGE}:latest"
    - echo "Deployment successful"
  environment:
    name: production
    url: http://localhost:8000
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "GitLab-CI-CD-pipeline"'
      when: on_success
  tags:
    - windows

# STAGE 4 - Deploy to Staging (Bonus)
staging_deploy:
  stage: deploy
  script:
    - echo "Deploying to staging"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull "${CI_REGISTRY_IMAGE}:$CI_COMMIT_REF_SLUG"
    - docker stop ecommerce-staging 2>$null; echo "stopped"
    - docker rm ecommerce-staging 2>$null; echo "removed"
    - docker run -d --name ecommerce-staging -p 8001:8000 "${CI_REGISTRY_IMAGE}:$CI_COMMIT_REF_SLUG"
    - echo "Deployment successful"
  environment:
    name: staging
    url: http://localhost:8001
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  tags:
    - windows
