# GitLab CI/CD Pipeline - Django E-commerce Application
# Portable Docker-based pipeline - runs on any GitLab Runner with Docker executor

image: python:3.11-slim

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  DOCKER_DRIVER: overlay2
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Cache pip packages for faster builds
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - venv/

# Template for Python jobs
.python_base:
  before_script:
    - apt-get update -qq && apt-get install -y -qq sqlite3
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - python manage.py collectstatic --noinput

# STAGE 1 - Run Tests & Code Quality
run_tests:
  extends: .python_base
  stage: test
  script:
    - echo "Running Django system checks..."
    - python manage.py check
    - echo "Checking migrations..."
    - python manage.py makemigrations --dry-run --check
    - echo "Running database migrations..."
    - python manage.py migrate
    - echo "Running unit tests..."
    - python manage.py test --verbosity=2
    - echo "✅ All tests passed successfully"
  artifacts:
    when: always
    reports:
      junit: test-results/*.xml
    paths:
      - test-results/
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)$/'

code_quality:
  extends: .python_base
  stage: test
  script:
    - echo "Installing linting tools..."
    - pip install flake8
    - echo "Running flake8 code quality check..."
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=migrations,__pycache__,venv,.venv
    - echo "Running full flake8 check (warnings allowed)..."
    - flake8 . --count --max-line-length=127 --statistics --exclude=migrations,__pycache__,venv,.venv || true
    - echo "✅ Code quality check complete"
  allow_failure: true

# STAGE 2 - Build Docker Image
build_docker_image:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "Building Docker image..."
    - docker build -t $DOCKER_IMAGE .
    - docker tag $DOCKER_IMAGE "${CI_REGISTRY_IMAGE}:latest"
    - echo "Pushing to GitLab Container Registry..."
    - docker push $DOCKER_IMAGE
    - docker push "${CI_REGISTRY_IMAGE}:latest"
    - echo "✅ Docker image built and pushed: ${CI_REGISTRY_IMAGE}:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"'
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# STAGE 3 - Deploy to Production
deploy_production:
  stage: deploy
  image: docker:24-cli
  variables:
    GIT_STRATEGY: none
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "🚀 Deploying to production..."
    - echo "Branch $CI_COMMIT_BRANCH - Commit $CI_COMMIT_SHA"
    - docker pull "${CI_REGISTRY_IMAGE}:latest"
    - docker stop ecommerce-app || true
    - docker rm ecommerce-app || true
    - docker run -d --name ecommerce-app -p 8000:8000 --restart unless-stopped "${CI_REGISTRY_IMAGE}:latest"
    - echo "✅ Deployment successful - App running on port 8000"
  environment:
    name: production
    url: http://your-domain.com
    on_stop: stop_production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  only:
    - main

# Stop production deployment
stop_production:
  stage: deploy
  image: docker:24-cli
  variables:
    GIT_STRATEGY: none
  script:
    - docker stop ecommerce-app || true
    - docker rm ecommerce-app || true
    - echo "✅ Production deployment stopped"
  environment:
    name: production
    action: stop
  when: manual
  only:
    - main

# Deploy to Staging (auto on develop branch)
deploy_staging:
  stage: deploy
  image: docker:24-cli
  variables:
    GIT_STRATEGY: none
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "🚀 Deploying to staging..."
    - docker pull "${CI_REGISTRY_IMAGE}:$CI_COMMIT_REF_SLUG"
    - docker stop ecommerce-staging || true
    - docker rm ecommerce-staging || true
    - docker run -d --name ecommerce-staging -p 8001:8000 --restart unless-stopped "${CI_REGISTRY_IMAGE}:$CI_COMMIT_REF_SLUG"
    - echo "✅ Staging deployment successful - App running on port 8001"
  environment:
    name: staging
    url: http://staging.your-domain.com
    on_stop: stop_staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  only:
    - develop

# Stop staging deployment
stop_staging:
  stage: deploy
  image: docker:24-cli
  variables:
    GIT_STRATEGY: none
  script:
    - docker stop ecommerce-staging || true
    - docker rm ecommerce-staging || true
    - echo "✅ Staging deployment stopped"
  environment:
    name: staging
    action: stop
  when: manual
  only:
    - develop
