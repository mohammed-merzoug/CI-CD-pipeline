{% extends 'dashboard/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Gestion des catégories</h1>
    <a href="{% url 'dashboard:category_create' %}" class="btn btn-primary">
        <i class="bi bi-plus"></i> Nouvelle catégorie
    </a>
</div>

<div class="row">
    {% for category in categories %}
    <div class="col-md-4 mb-3">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ category.name }}</h5>
                <p class="card-text text-muted">{{ category.products.count }} produit(s)</p>
                <a href="{% url 'dashboard:category_edit' category.pk %}" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-pencil"></i> Modifier
                </a>
                <a href="{% url 'dashboard:category_delete' category.pk %}" class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-trash"></i> Supprimer
                </a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="alert alert-info">Aucune catégorie</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
