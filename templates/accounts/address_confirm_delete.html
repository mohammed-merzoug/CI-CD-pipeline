{% extends 'base.html' %}

{% block title %}Supprimer l'adresse - E-Commerce{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h3>Confirmer la suppression</h3>
                    <p>Êtes-vous sûr de vouloir supprimer cette adresse ?</p>
                    <div class="alert alert-warning">
                        <strong>{{ address.full_name }}</strong><br>
                        {{ address.address_line1 }}<br>
                        {{ address.city }}
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Supprimer</button>
                        <a href="{% url 'accounts:address_list' %}" class="btn btn-secondary">Annuler</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
